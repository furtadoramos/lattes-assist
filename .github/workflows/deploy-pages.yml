name: Deploy Lattes Assist to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# A raiz publica a v1.6 estável. /beta/ e /rc/ publicam a mesma v1.7 RC1 congelada, sem merge na main.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Montar v1.7 RC1 sem mesclar na main
        shell: bash
        run: |
          git fetch origin release/v1.7-rc1 --depth=1
          mkdir -p beta rc
          git archive --format=tar FETCH_HEAD | tar -x -C beta
          cp -a beta/. rc/
          rm -rf beta/.github rc/.github

      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
