name: Password Recovery Beta Checks

on:
  push:
    branches: ["feature/password-recovery"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in app-*.js bootstrap.js install.js sw.js; do
            node --check "$f"
          done

      - name: Manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"

      - name: Module completeness
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const b=fs.readFileSync('bootstrap.js','utf8');
          const mods=[...b.matchAll(/app-(\d{2})\.js/g)].map(m=>m[1]);
          const uniq=[...new Set(mods)];
          const expected=Array.from({length:42},(_,i)=>String(i+1).padStart(2,'0'));
          if(uniq.length!==41) throw new Error(`bootstrap contém ${uniq.length} módulos únicos; esperado 42`);
          for(const n of expected) if(!uniq.includes(n)) throw new Error(`app-${n}.js ausente do bootstrap`);
          if(b.indexOf('app-41.js')<b.indexOf('app-40.js')) throw new Error('app-41.js precisa carregar após app-40.js');
          const sw=fs.readFileSync('sw.js','utf8');
          if(!/length:42/.test(sw)) throw new Error('service worker não cacheia 41 módulos');
          if(!sw.includes('lattes-assist-v1.8.1-beta-password-recovery-1')) throw new Error('cache beta de recuperação ausente');
          const idx=fs.readFileSync('index.html','utf8');
          if(!idx.includes('bootstrap.js?v=recovery1')) throw new Error('index não força bootstrap recovery1');
          if(!idx.includes('<title>Lattes Assist v1.8.1 beta</title>')) throw new Error('identidade beta v1.8.1 ausente');
          console.log('module completeness ok');
          NODE

      - name: Password recovery contract
        shell: bash
        run: |
          node <<'NODE'
          const assert=require('assert');
          require('./app-41.js');
          const p=globalThis.LattesPasswordRecovery;
          assert(p,'LattesPasswordRecovery não exportado');
          assert(p.recoveryUrlHasIntent('https://example.test/#access_token=x&type=recovery'));
          assert(!p.recoveryUrlHasIntent('https://example.test/#access_token=x&type=signup'));
          assert(p.recoveryUrlHasError('https://example.test/#error=access_denied&error_code=otp_expired'));
          assert.equal(p.validateRecoveryPasswords('1234567','1234567'),'A nova senha deve ter pelo menos 8 caracteres.');
          assert.equal(p.validateRecoveryPasswords('12345678','87654321'),'As duas senhas não coincidem.');
          assert.equal(p.validateRecoveryPasswords('12345678','12345678'),'');
          console.log('password recovery helpers ok');
          NODE
          grep -q "Esqueci minha senha" app-41.js
          grep -q "resetPasswordForEmail" app-41.js
          grep -q "PASSWORD_RECOVERY" app-41.js
          grep -q "updateUser({password" app-41.js
          grep -q "Se existir uma conta para este e-mail" app-41.js
          grep -q "PASSWORD_RECOVERY_REDIRECT='https://furtadoramos.github.io/lattes-assist/beta/'" app-41.js

      - name: Existing critical features
        shell: bash
        run: |
          grep -q "Importar resultados do PoP" app-36.js
          grep -q "Gerenciar excluídos" app-39.js
          grep -q "Remover da Fila" app-39.js
          grep -q "Cofre recuperado com segurança" app-34.js
          grep -q "Cofre criptografado confirmado no servidor" app-31.js
          grep -q "Sair da conta" app-32.js
          grep -q "10. Fila" app-29.js

      - name: Conflict and secret guards
        shell: bash
        run: |
          if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' --include='*.js' --include='*.html' --include='*.css' --include='*.json' .; then
            echo 'Marcadores de conflito encontrados'; exit 1;
          fi
          if grep -R -nE 'sb_secret_|service_role|ORCID_PUBLIC_CLIENT_SECRET[[:space:]]*=|OPENALEX_API_KEY[[:space:]]*=' --include='*.js' --include='*.html' --include='*.css' .; then
            echo 'Possível segredo exposto no cliente'; exit 1;
          fi
          echo 'guards ok'

      - name: Direct recovery launcher contract
        shell: bash
        run: |
          grep -q "Recuperar senha de acesso" app-42.js
          grep -q "recover" app-42.js
          grep -q "password-reset" app-42.js
          grep -q "rc5RecoverPassword" app-42.js
          grep -q "cloudRecoverPassword" app-42.js
          grep -q "resetPasswordForEmail" app-42.js
          grep -q "PASSWORD_RECOVERY_REDIRECT_BETA2" app-42.js
