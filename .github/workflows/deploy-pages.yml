name: Deploy Lattes Assist to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# A raiz, /beta/ e /rc/ publicam a v1.8 estável após a promoção autorizada.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable v1.8
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Montar espelhos beta e rc da v1.8 estável
        shell: bash
        run: |
          mkdir -p beta rc
          git archive --format=tar HEAD | tar -x -C beta
          cp -a beta/. rc/
          rm -rf beta/.github rc/.github

      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
