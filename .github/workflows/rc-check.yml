name: RC7 Regression Checks

on:
  push:
    branches: ["release/v1.7-rc7"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in app-*.js bootstrap.js install.js sw.js; do
            node --check "$f"
          done
      - name: Manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Module completeness
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const b=fs.readFileSync('bootstrap.js','utf8');
          const mods=[...b.matchAll(/app-(\d{2})\.js/g)].map(m=>m[1]);
          const uniq=[...new Set(mods)];
          const expected=Array.from({length:34},(_,i)=>String(i+1).padStart(2,'0'));
          if(uniq.length!==34) throw new Error(`bootstrap contém ${uniq.length} módulos únicos; esperado 34`);
          for(const n of expected) if(!uniq.includes(n)) throw new Error(`app-${n}.js ausente do bootstrap`);
          if(b.indexOf('app-34.js')<b.indexOf('app-33.js')) throw new Error('app-34.js precisa carregar depois de app-33.js');
          const sw=fs.readFileSync('sw.js','utf8');
          if(!/length:34/.test(sw)) throw new Error('service worker não cacheia 34 módulos');
          const idx=fs.readFileSync('index.html','utf8');
          if(!idx.includes('bootstrap.js?v=rc7-1')) throw new Error('index não força bootstrap RC7');
          if(!idx.includes('rc6.css?v=rc7-1')) throw new Error('index não força estilo lateral atual');
          if(!idx.includes('authBoot')) throw new Error('porta de autenticação inicial ausente');
          NODE
      - name: Existing critical feature markers
        shell: bash
        run: |
          grep -q "repairQueueEncoding" app-25.js
          grep -q "Reclassificar tipo" app-25.js
          grep -q "Referência externa manual" app-27.js
          grep -q "Cofre criptografado confirmado no servidor" app-31.js
          grep -q "Sair da conta" app-32.js
          grep -q "height:100dvh" rc6.css
          grep -q "overflow-y:auto" rc6.css
      - name: Atomic local restore guard
        shell: bash
        run: |
          grep -q "atomicReplaceEvidenceDbRc2" app-28.js
          grep -q "captureEvidenceRollbackRc2" app-28.js
          grep -q "tx.onabort" app-28.js
          grep -q "estado anterior foi recuperado" app-28.js
      - name: RC7 cloud vault schema guard
        shell: bash
        run: |
          grep -q "validateCloudVaultPayloadRc7" app-34.js
          grep -q "RC3_CLOUD_PAYLOAD_SCHEMA" app-34.js
          grep -q "applyCloudVaultPayloadRc7" app-34.js
          grep -q "rc3DownloadVault" app-34.js
          grep -q "atomicReplaceEvidenceDbRc2(prepared)" app-34.js
          grep -q "estado anterior foi recuperado" app-34.js
          grep -q "Cofre recuperado com segurança" app-34.js
          if grep -q "validateBackupPayloadRc2(manifest" app-34.js; then
            echo 'RC7 não pode validar manifesto de cofre como backup local'; exit 1;
          fi
      - name: RC7 cache freshness guard
        shell: bash
        run: |
          grep -q "rc7-cloud-restore" sw.js
          grep -q "length:34" sw.js
          grep -q "bootstrap.js?v=rc7-1" index.html
          grep -q "v1.7 RC7" app-34.js
      - name: Conflict markers
        shell: bash
        run: |
          if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' --include='*.js' --include='*.html' --include='*.css' --include='*.json' .; then
            echo 'Marcadores de conflito encontrados'; exit 1;
          fi
      - name: Secret exposure guard
        shell: bash
        run: |
          if grep -R -nE 'sb_secret_|service_role|ORCID_PUBLIC_CLIENT_SECRET[[:space:]]*=|OPENALEX_API_KEY[[:space:]]*=' --include='*.js' --include='*.html' --include='*.css' .; then
            echo 'Possível segredo exposto no cliente'; exit 1;
          fi
          echo 'secret exposure guard ok'
