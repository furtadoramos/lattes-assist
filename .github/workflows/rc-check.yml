name: RC4 Regression Checks

on:
  push:
    branches: ["release/v1.7-rc4"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in app-*.js bootstrap.js install.js sw.js; do
            node --check "$f"
          done
      - name: Manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Module completeness
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const b=fs.readFileSync('bootstrap.js','utf8');
          const mods=[...b.matchAll(/app-(\d{2})\.js/g)].map(m=>m[1]);
          const uniq=[...new Set(mods)];
          const expected=Array.from({length:31},(_,i)=>String(i+1).padStart(2,'0'));
          if(uniq.length!==31) throw new Error(`bootstrap contém ${uniq.length} módulos únicos; esperado 31`);
          for(const n of expected) if(!uniq.includes(n)) throw new Error(`app-${n}.js ausente do bootstrap`);
          if(b.indexOf('app-31.js')<b.indexOf('app-30.js')) throw new Error('app-31.js precisa carregar depois de app-30.js');
          const sw=fs.readFileSync('sw.js','utf8');
          if(!/length:31/.test(sw)) throw new Error('service worker não cacheia 31 módulos');
          const idx=fs.readFileSync('index.html','utf8');
          if(!idx.includes('authBoot')) throw new Error('porta de autenticação inicial ausente');
          console.log('module completeness ok');
          NODE
      - name: Existing critical feature markers
        shell: bash
        run: |
          grep -q "repairQueueEncoding" app-25.js
          grep -q "Reclassificar tipo" app-25.js
          grep -q "Data não informada" app-24.js
          grep -q "Referência externa manual" app-27.js
          grep -q "ResearchGate" app-27.js
          grep -q "orcid-public" app-20.js
          grep -q "openalex-public" app-22.js
      - name: Atomic local restore guard
        shell: bash
        run: |
          grep -q "atomicReplaceEvidenceDbRc2" app-28.js
          grep -q "captureEvidenceRollbackRc2" app-28.js
          grep -q "tx.onabort" app-28.js
          grep -q "estado anterior foi recuperado" app-28.js
      - name: RC3 navigation and encryption guard
        shell: bash
        run: |
          grep -q "10. Fila" app-29.js
          grep -q "backupRestorePassphrase" app-29.js
          grep -q "Exportar backup criptografado" app-29.js
          grep -q "RC3_CLOUD_BUCKET='lattes-assist-vaults'" app-29.js
          grep -q "RC3_CHUNK_SIZE=8\*1024\*1024" app-29.js
          grep -q "user_snapshots').delete" app-30.js
          grep -q "user_preferences').delete" app-30.js
      - name: RC4 profile and logout guard
        shell: bash
        run: |
          grep -q "userProfileCard" app-31.js
          grep -q "rc4SignOut" app-31.js
          grep -q "cloudSignOut" app-31.js
          grep -q "Conta / cofre" app-31.js
          grep -q "v1.7 RC4" app-31.js
      - name: RC4 remote vault verification guard
        shell: bash
        run: |
          grep -q "rc4VerifyVaultPersistence" app-31.js
          grep -q "header.bin" app-31.js
          grep -q "Ainda existem dados curriculares legados não criptografados" app-31.js
          grep -q "Cofre criptografado confirmado no servidor" app-31.js
          grep -q "user_cloud_vaults" app-31.js
      - name: Conflict markers
        shell: bash
        run: |
          if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' --include='*.js' --include='*.html' --include='*.css' --include='*.json' .; then
            echo 'Marcadores de conflito encontrados'; exit 1;
          fi
      - name: Secret exposure guard
        shell: bash
        run: |
          if grep -R -nE 'sb_secret_|service_role|ORCID_PUBLIC_CLIENT_SECRET[[:space:]]*=|OPENALEX_API_KEY[[:space:]]*=' --include='*.js' --include='*.html' --include='*.css' .; then
            echo 'Possível segredo exposto no cliente'; exit 1;
          fi
          echo 'secret exposure guard ok'
